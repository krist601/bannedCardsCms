name: Deploy CMS to Lightsail

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-cms-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  DEPLOY_PATH: /opt/banned-cards

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out CMS
        uses: actions/checkout@v4

      - name: Package CMS source
        run: |
          tar --exclude=.git --exclude=node_modules --exclude=.next --exclude='*.log' \
            -czf "$RUNNER_TEMP/cms.tar.gz" .

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.LIGHTSAIL_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.LIGHTSAIL_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/lightsail_deploy
          chmod 600 ~/.ssh/lightsail_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Upload CMS source
        env:
          LIGHTSAIL_HOST: ${{ secrets.LIGHTSAIL_HOST }}
          LIGHTSAIL_USER: ${{ secrets.LIGHTSAIL_USER }}
        run: |
          scp -i ~/.ssh/lightsail_deploy "$RUNNER_TEMP/cms.tar.gz" "$LIGHTSAIL_USER@$LIGHTSAIL_HOST:/tmp/banned-cards-cms.tar.gz"

      - name: Build and restart CMS
        env:
          LIGHTSAIL_HOST: ${{ secrets.LIGHTSAIL_HOST }}
          LIGHTSAIL_USER: ${{ secrets.LIGHTSAIL_USER }}
        run: |
          ssh -i ~/.ssh/lightsail_deploy "$LIGHTSAIL_USER@$LIGHTSAIL_HOST" \
            'set -e; mkdir -p /opt/banned-cards/cms; tar -xzf /tmp/banned-cards-cms.tar.gz -C /opt/banned-cards/cms; rm -f /tmp/banned-cards-cms.tar.gz; cd /opt/banned-cards; docker compose up -d --build cms caddy; docker compose ps cms caddy'
